databases:
  - name: salon-postgres
    databaseName: salon_db
    user: salon
    plan: free

services:
  - type: web
    name: smg-backend
    runtime: node
    plan: free
    rootDir: salon-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 24
      # The 2026 price list is already live. RESEED_SERVICES is intentionally
      # NOT set: leaving it true would overwrite admin price edits on every
      # restart. Re-add it for one deploy only if the price list changes again
      # (see salon-backend/.env.example).

  - type: web
    name: smg-frontend
    runtime: static
    rootDir: salon-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: smg-backend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME